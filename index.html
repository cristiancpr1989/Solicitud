<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solicitud de Servicios</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --navy:#1B3A6B; --blue:#0072BC; --sky:#00AEEF; --gold:#E8B10E;
  --bg:#F4F6FA; --card:#FFFFFF; --ink:#1C2430; --muted:#5F6B7A; --line:#D9DFE8;
  --err:#C62828; --errbg:#FDECEC; --ok:#2E7D32; --okbg:#E8F5E9; --warnbg:#FFF6DB;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Segoe UI",Roboto,Arial,sans-serif}
header{background:var(--card);border-bottom:4px solid var(--navy)}
.hwrap{max-width:1100px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.hwrap img{height:44px}
.htitle{flex:1;min-width:200px}
.htitle h1{margin:0;font-size:20px;color:var(--navy)}
.htitle small{color:var(--muted)}
.code{font:600 12px/1.3 Consolas,monospace;color:var(--navy);text-align:right}
main{max-width:1100px;margin:0 auto;padding:16px}
.steps{display:flex;gap:6px;margin:4px 0 16px;flex-wrap:wrap}
.steps div.warn{background:var(--warnbg);color:#7A5B00}
.steps div{cursor:pointer;flex:1;min-width:120px;padding:8px 10px;border-radius:6px;background:#E6EAF1;color:var(--muted);font-size:13px;font-weight:600}
.steps div.on{background:var(--navy);color:#fff}
.steps div.done{background:#CFE3F5;color:var(--navy)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:16px}
.card h2{margin:0 0 4px;font-size:17px;color:var(--navy)}
.card p.lead{margin:0 0 14px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px 16px}
.f{display:flex;flex-direction:column;gap:4px}
.f label{font-size:13px;font-weight:600}
.f label .req{color:var(--err)}
input[type=text],input[type=email],input[type=tel],select,textarea{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);width:100%}
textarea{min-height:64px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--sky);border-color:var(--sky)}
.bad{border-color:var(--err)!important;background:var(--errbg)!important}
input.ro{background:#EEF2F8;color:#33415C;cursor:not-allowed}
.nitrow{display:flex;gap:8px}
.nitrow input{flex:1}
.msg{color:var(--err);font-size:12px}
.hint{color:var(--muted);font-size:12px}
.btn{font:600 14px/1 inherit;font-family:inherit;padding:10px 16px;border-radius:6px;border:1px solid var(--navy);background:var(--navy);color:#fff;cursor:pointer}
.btn.sec{background:#fff;color:var(--navy)}
.btn.small{padding:6px 10px;font-size:13px}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1C2430}
.btn:disabled{opacity:.5;cursor:not-allowed}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:8px;flex-wrap:wrap}
.radios{display:flex;gap:8px;flex-wrap:wrap}
.radios label{display:flex;gap:6px;align-items:center;padding:8px 12px;border:1px solid var(--line);border-radius:6px;cursor:pointer;font-weight:500;background:#fff}
.radios label.sel{border-color:var(--blue);background:#E7F2FB}
.note{padding:10px 12px;border-radius:6px;background:#E7F2FB;border-left:4px solid var(--blue);font-size:14px;margin:10px 0}
.note.warn{background:var(--warnbg);border-color:var(--gold)}
.note.err{background:var(--errbg);border-color:var(--err)}
.note.ok{background:var(--okbg);border-color:var(--ok)}
.drop{border:2px dashed var(--line);border-radius:10px;padding:22px;text-align:center;background:#FAFBFD}
.drop.over{border-color:var(--blue);background:#E7F2FB}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;margin-top:12px}
table{border-collapse:collapse;width:100%;min-width:980px}
th,td{border-bottom:1px solid var(--line);padding:6px;vertical-align:top;text-align:left}
th{background:#EEF2F8;font-size:12px;color:var(--navy);position:sticky;top:0}
td input,td select{padding:6px 7px;font-size:13px}
td .msg{display:block;margin-top:2px}
td.n{font-weight:700;color:var(--navy);width:34px}
.errlist{max-height:180px;overflow:auto;margin:8px 0 0;padding-left:18px;font-size:13px;color:var(--err)}
.item{border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:12px}
.item h3{margin:0 0 2px;font-size:15px;color:var(--navy)}
.item .sub{color:var(--muted);font-size:13px;margin-bottom:8px}
.req-box{font-size:13px;background:#F6F8FB;border-radius:6px;padding:6px 8px;margin-bottom:10px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:end;padding:10px;background:#F6F8FB;border-radius:8px;margin-bottom:12px}
.toolbar .f{min-width:220px}
.epp{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:6px}
.epp label{display:flex;gap:8px;align-items:center;font-size:14px}
.sum dt{font-weight:600;color:var(--navy);margin-top:6px}
.sum dd{margin:0 0 4px}
.link{word-break:break-all;font:13px Consolas,monospace;background:#F6F8FB;padding:8px;border-radius:6px;border:1px solid var(--line)}
.hidden{display:none!important}
@media print{header .code,.steps,.nav,.noprint{display:none!important}body{background:#fff}.card{border:none}}
</style>
</head>

// Separa "0,01 g" o "20\50\100 °C" en valor y unidad, según las unidades permitidas
function separarUnidad(raw, lista){
  raw = String(raw ?? "").trim();
  if(!raw || norm(raw) === "no disponible") return {v: raw, u: "", ut: ""};
  const m = raw.match(/^(.*?\d)\s*([^\d\s\\.,;|\/-].*)?$/);
  if(!m) return {v: raw, u: "", ut: ""};
  const ut = (m[2] || "").trim();
  return {v: m[1].trim(), u: buscarUnidad(lista, ut), ut};
}
// Puntos: acepta "20\\50\\100 °C" y también "1 g\\10 g" (unidad en cada punto, la misma para todos)
function separarPuntos(raw, lista){
  raw = String(raw ?? "").trim();
  const toks = raw.split("\\").map(x => x.trim()).filter(Boolean);
  if(toks.length > 1){
    const partes = toks.map(t => separarUnidad(t, lista));
    const unidades = [...new Set(partes.map(x => x.u).filter(Boolean))];
    const sinReconocer = partes.find(x => x.ut && !x.u);
    if(!sinReconocer && unidades.length === 1) return {v: partes.map(x => x.v).join("\\"), u: unidades[0], ut: ""};
    if(unidades.length > 1) return {v: partes.map(x => x.v).join("\\"), u: "", ut: "varias unidades (" + unidades.join(", ") + ")"};
  }
  return separarUnidad(raw, lista);
}

  /\bver (foto|adjunto|equipo|imagen|etiqueta)\b/,/\bel mismo\b/,/\bmismo que\b/,/\bigual (a|al|que)\b/,/\bal llegar\b/,/\bal recibir\b/
];
function placeholderReason(v){
  const raw = String(v ?? "").trim();
  if(!raw) return null;
  if(!/[A-Za-z0-9]/.test(raw)) return "solo contiene símbolos";
  const n = norm(raw);
  if(PH_EXACT.has(n)) return "«"+raw+"» no es un dato válido";
  for(const re of PH_CONTAINS) if(re.test(n)) return "«"+raw+"» no es un dato válido";
  if(/^(.)\1+$/.test(n.replace(/ /g,""))) return "«"+raw+"» no es un dato válido";
  return null;
}

function vCliente(){
  const e = {}, c = S.cliente, r = S.resultados;
  if(!c.nombre.trim()) e["cliente.nombre"] = "Obligatorio";
  const nit = c.nit.replace(/[.\s]/g,"");
  if(!nit) e["cliente.nit"] = "Obligatorio";
  else if(!/^\d{5,12}(-\d)?$/.test(nit)) e["cliente.nit"] = "Solo números, con dígito de verificación opcional (ej. 900123456-7)";
  if(!c.direccion.trim()) e["cliente.direccion"] = "Obligatorio";
  if(!MUN_SET.has(c.ciudad)) e["cliente.ciudad"] = "Elija una ciudad de la lista";
  if(!c.contacto.trim()) e["cliente.contacto"] = "Obligatorio";
  if(!isEmail(c.correo)) e["cliente.correo"] = "Correo no válido";
  const b = S.base || {};
  if(b.estado === "buscando") e["cliente.nit"] = "Consultando el NIT…";
  if(b.estado === "encontrado" && b.sede === -2) e["base.sede"] = "Seleccione la sede donde se prestará el servicio";
  const cots = cotizacionesDisponibles();
  if(!c.cotizacion.trim()) e["cliente.cotizacion"] = cots.length ? "Seleccione la cotización" : "Indique el número de la cotización aceptada";
  else if(cots.length && !cots.includes(c.cotizacion)) e["cliente.cotizacion"] = "Seleccione una cotización de la lista";
  if(!["SI","NO"].includes(c.fact_mismo)) e["cliente.fact_mismo"] = "Seleccione una opción";
  else if(c.fact_mismo === "NO" && !isEmail(c.correo_facturas)) e["cliente.correo_facturas"] = "Correo no válido";
  if(!SND.includes(r.tercero)) e["resultados.tercero"] = "Seleccione una opción";
  if(r.tercero === "SI"){
    if(!r.nombre.trim()) e["resultados.nombre"] = "Obligatorio";
    if(!r.direccion.trim()) e["resultados.direccion"] = "Obligatorio";
    if(!MUN_SET.has(r.ciudad)) e["resultados.ciudad"] = "Elija una ciudad de la lista";
  }
  return e;
}
function vEquipoRow(q, i, all){
  const e = {}, p = "eq."+i+".";
  const okND = v => ACEPTA_ND.includes(q.magnitud) && norm(v) === "no disponible";
  if(!CAT.mag.some(m => m.n === q.magnitud)) e[p+"magnitud"] = q.magnitud_original ? "«"+q.magnitud_original+"» no está en la lista. Elija la magnitud" : "Elija la magnitud";
  for(const k of ["equipo","marca","modelo"]){
    const v = (q[k]||"").trim();
    if(!v){ e[p+k] = "Obligatorio"; continue; }
    if(k !== "equipo" && okND(v)) continue;
    const ph = placeholderReason(v);
    if(ph){ e[p+k] = ph + ". Escriba el dato real de la placa del equipo"; continue; }
    if(k !== "equipo" && v.replace(/[^A-Za-z0-9]/g,"").length < 2) e[p+k] = "Demasiado corto";
  }
  const se = (q.serie||"").trim(), id = (q.id||"").trim();
  for(const [k,v] of [["serie",se],["id",id]]){
    const ph = okND(v) ? null : placeholderReason(v);
    if(ph) e[p+k] = ph + ". Si no existe, deje la celda vacía";
  }
  if(!se && !id){ e[p+"serie"] = "Indique la serie o el ID del equipo (al menos uno)"; e[p+"id"] = " "; }
  const res = (q.resolucion||"").trim(), lr = unidRes(q.magnitud);
  if((!res && (SIN_RESOLUCION.includes(q.magnitud) || !lr.length)) || okND(res)) {}
  else if(!res) e[p+"resolucion"] = "Obligatorio";
  else if(placeholderReason(res)) e[p+"resolucion"] = placeholderReason(res) + ". Escriba el valor, por ejemplo 0,1";
  else if(!/^\d[\d.,]*$/.test(res.replace(/\s/g,""))) e[p+"resolucion"] = "Escriba solo el número; la unidad se elige al lado";
  else if(lr.length > 1 && !q.res_uni) e[p+"resolucion"] = q.res_uinv ? "Unidad «" + q.res_uinv + "» no válida. Elija la unidad" : "Elija la unidad";
  const u = (q.ubicacion||"").trim();
  if(u && norm(u) !== "no disponible" && placeholderReason(u)) e[p+"ubicacion"] = placeholderReason(u) + ". Si no la conoce, deje la celda vacía";
  if(se && !okND(se)){
    const dup = all.findIndex((o,j) => j < i && norm(o.serie) === norm(se) && o.magnitud === q.magnitud);
    if(dup >= 0) e[p+"serie"] = "Serie repetida con el equipo "+(dup+1);
  }
  return e;
}
function vEquipos(){
  let e = {};
  if(!S.lugar) e["lugar"] = "Seleccione el lugar de ejecución";
  if(!S.equipos.length) e["equipos"] = "Cargue el archivo o agregue al menos un equipo";
  if(S.equipos.length > MAX_ITEMS) e["equipos"] = "Máximo "+MAX_ITEMS+" equipos por solicitud. Divida la solicitud en varias";
  S.equipos.forEach((q,i) => Object.assign(e, vEquipoRow(q,i,S.equipos)));
  return e;
}
function vDetalle(){
  const e = {};
  S.equipos.forEach((q,i) => {
    const p = "eq."+i+".";
    if(!CAT.tipos.includes(q.tipo_servicio)) e[p+"tipo_servicio"] = q.servicio_original ? "«" + q.servicio_original + "» no está en la lista. Seleccione el servicio" : "Seleccione el tipo de servicio";
    const fx = PUNTOS_FIJOS[q.magnitud];
    if(fx){
      if((q.pinv||[]).length) e[p+"puntos"] = "El archivo trae puntos no permitidos: " + q.pinv.join(", ") + ". Marque los puntos de la lista";
      else if(!(q.psel||[]).length) e[p+"puntos"] = "Seleccione al menos un punto";
    }
    else if(!(q.puntos||"").trim()) e[p+"puntos"] = "Indique los puntos o características";
    else if(placeholderReason(q.puntos)) e[p+"puntos"] = placeholderReason(q.puntos);
    else if(unidPts(q.magnitud).length > 1 && !q.pts_uni) e[p+"puntos"] = q.pts_uinv ? "Unidad «" + q.pts_uinv + "» no válida. Elija la unidad" : "Elija la unidad de los puntos";
    if(!q.conformidad) e[p+"conformidad"] = "Seleccione";

}

function get(path){ return path.split(".").reduce((o,k)=>o?.[k], S); }
function set(path, val){
  const ks = path.split("."); let o = S;
  for(let i=0;i<ks.length-1;i++) o = o[ks[i]];

}
function errHtml(key){ return showErr && errs[key] && errs[key].trim() ? `<span class="msg">${esc(errs[key])}</span>` : ""; }
function bad(key){ return showErr && errs[key] ? " bad" : ""; }
function inp(path, label, opt={}){
  const v = get(path) ?? "";
  const type = opt.type || "text";
  const list = opt.list ? ` list="${opt.list}"` : "";
  const ph = opt.ph ? ` placeholder="${esc(opt.ph)}"` : "";
  const ctl = opt.area
    ? `<textarea data-p="${path}" class="${bad(path)}"${ph}>${esc(v)}</textarea>`
    : `<input type="${type}" data-p="${path}" value="${esc(v)}" class="${bad(path)}${opt.ro?" ro":""}"${list}${ph}${opt.ro?" readonly tabindex=\"-1\"":""} autocomplete="off">`;
  return `<div class="f"><label>${esc(label)}${opt.req?' <span class="req">*</span>':""}</label>${ctl}${opt.hint?`<span class="hint">${esc(opt.hint)}</span>`:""}${errHtml(path)}</div>`;
}
function sel(path, label, options, opt={}){
  const v = get(path) ?? "";
  const o = [`<option value="">— Seleccione —</option>`].concat(options.map(x => `<option${x===v?" selected":""}>${esc(x)}</option>`)).join("");
  return `<div class="f"><label>${esc(label)}${opt.req?' <span class="req">*</span>':""}</label><select data-p="${path}" class="${bad(path)}">${o}</select>${opt.hint?`<span class="hint">${esc(opt.hint)}</span>`:""}${errHtml(path)}</div>`;
}
function radios(path, label, options, opt={}){
  const v = get(path);
  const r = options.map(x => `<label class="${x===v?"sel":""}"><input type="radio" name="${path}" data-p="${path}" value="${esc(x)}"${x===v?" checked":""}> ${esc(x)}</label>`).join("");
  return `<div class="f"><label>${esc(label)}${opt.req?' <span class="req">*</span>':""}</label><div class="radios">${r}</div>${errHtml(path)}</div>`;
}

/* ====== EVENTOS ====== */
function bind(){
  document.querySelectorAll("[data-p]").forEach(el => {
    const ev = (el.tagName === "SELECT" || el.type === "radio" || el.type === "checkbox") ? "change" : "input";
    el.addEventListener(ev, () => {
      const path = el.dataset.p;
      const val = el.type === "checkbox" ? el.checked : el.value;
      set(path, val);
      if(path === "cliente.nit" && (S.base||{}).estado){
        // si cambia el NIT, se descartan los datos precargados del anterior
        if(S.base.estado === "encontrado"){ S.cliente.nombre = ""; S.cliente.direccion = ""; S.cliente.cotizacion = ""; S.cliente.sede = ""; }
        S.base = {estado:"", nombre:"", sedes:[], sede:-2};
      }
      if(path.startsWith("equipos.")){
        const [, i, k] = path.split("."); const q = S.equipos[+i];
        if(k === "magnitud"){ delete q.magnitud_original; q._tocado = false; applyDefaults(q); q.res_uinv = ""; ajustarUnidades(q); parsePuntos(q, q.praw ?? (PUNTOS_FIJOS[val] ? "" : q.puntos)); }
        else if(k === "res_uni") q.res_uinv = "";
        else if(k === "pts_uni") q.pts_uinv = "";
        else if(k === "equipo") applyDefaults(q);
        else if(["conformidad","emp","origen_emp","incertidumbre"].includes(k)) q._tocado = true;
        else if(k === "puntos") q.praw = val;
      }
      save();
      // re-render solo cuando cambia la estructura (selects/radios) para no perder el foco al escribir
      if(ev === "change") render();
      else if(showErr) softValidate(el, path);
    });
  });
  document.querySelectorAll("[data-epp]").forEach(el => el.addEventListener("change", () => {
    const x = el.dataset.epp; const a = S.sitio.epp;
    if(el.checked){ if(!a.includes(x)) a.push(x); } else S.sitio.epp = a.filter(y=>y!==x);
    save(); render();
  }));
  document.querySelector("[data-sede]")?.addEventListener("change", e => aplicarSede(+e.target.value));
  const nitEl = document.querySelector("[data-p='cliente.nit']");
  if(nitEl){
    nitEl.addEventListener("change", () => { if(nitCandidatos(S.cliente.nit).length && !["encontrado","buscando"].includes((S.base||{}).estado)) buscarNit(); });
    nitEl.addEventListener("keydown", e => { if(e.key === "Enter"){ e.preventDefault(); buscarNit(); } });
  }
  document.querySelectorAll("[data-pt]").forEach(el => el.addEventListener("change", () => {
    const [i, v] = el.dataset.pt.split("|"); const q = S.equipos[+i];
    const a = new Set(q.psel || []); el.checked ? a.add(v) : a.delete(v);
    q.psel = [...a]; q.pinv = []; q.puntos = puntosFijosTexto(q); q.praw = q.puntos;
    save(); render();
  }));
  document.querySelectorAll("[data-go]").forEach(el => {
    el.addEventListener("click", () => irA(+el.dataset.go));
    el.addEventListener("keydown", e => { if(e.key === "Enter") irA(+el.dataset.go); });
  });
  document.querySelectorAll("[data-a]").forEach(el => el.addEventListener("click", () => act(el.dataset.a, el)));
  const drop = $("#drop");
  if(drop){
    $("#file").addEventListener("change", e => { if(e.target.files[0]) readFile(e.target.files[0]); });
    ["dragenter","dragover"].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.add("over"); }));
    ["dragleave","drop"].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.remove("over"); }));
    drop.addEventListener("drop", e => { const f = e.dataTransfer.files[0]; if(f) readFile(f); });
  }
}
// Al escribir: actualiza el marcado de error del campo sin redibujar toda la vista
function softValidate(el, path){
  errs = VALID[step]();
  const key = path.startsWith("equipos.") ? "eq."+path.split(".").slice(1).join(".") : path;
  const m = errs[key];
  el.classList.toggle("bad", !!m);
  let span = el.parentElement.querySelector(".msg");
  if(m && m.trim()){ if(!span){ span = document.createElement("span"); span.className = "msg"; el.parentElement.appendChild(span); } span.textContent = m; }
  else if(span) span.remove();
}
function vidrioExcepcion(equipo){
  const e = norm(equipo); if(!e) return false;
  return VIDRIO_SIN_CONF.some(x => norm(x).split(" ").filter(w => w.length > 3 && w !== "vidrio").every(w => e.includes(w)));
}
function defaultsFor(mag, equipo){
  const si = {conformidad:"SI", emp:EMP_PTC, origen_emp:ORIG_DN, incertidumbre:"Si"};
  const no = {conformidad:"NO", emp:"", origen_emp:"", incertidumbre:""};
  if(mag === M_PISTON || mag === M_PESA_N) return si;
  if(mag === M_VOL_V) return vidrioExcepcion(equipo) ? no : si;
  return no;
}
// Aplica los valores por defecto mientras el cliente no los haya cambiado a mano
function applyDefaults(q){ if(q._tocado || !q.magnitud) return; Object.assign(q, defaultsFor(q.magnitud, q.equipo)); }
// Puntos: en magnitudes fijas se arma "(4\7\10) Unidades de pH"; en las demás, texto separado con "\"
function puntosFijosTexto(q){
  const f = PUNTOS_FIJOS[q.magnitud]; if(!f) return q.puntos;
  const sel = f.v.filter(v => (q.psel||[]).includes(v));
  return sel.length ? ("(" + sel.join("\\") + ")" + (f.u ? " " + f.u : "")) : "";
}
function parsePuntos(q, raw){
  raw = String(raw ?? "").trim();
  const f = PUNTOS_FIJOS[q.magnitud];
  if(!f){
    q.psel = []; q.pinv = [];
    const sp = separarPuntos(raw.replace(/\s*[;|]\s*/g, "\\"), unidPts(q.magnitud));
    q.puntos = sp.v; if(sp.u) q.pts_uni = sp.u; q.pts_uinv = sp.u ? "" : sp.ut;
    ajustarUnidades(q); return;
  }
  const toks = raw.replace(/[A-Za-zµμ°()%]/g, " ").split(/[\\\/;|\s]+/).map(t => t.replace(".", ",").replace(/^0+(?=\d)/, "")).filter(Boolean);
  q.psel = f.v.filter(v => toks.includes(v));
  q.pinv = [...new Set(toks.filter(t => !f.v.includes(t)))];
  q.puntos = puntosFijosTexto(q);
}
// Cambia de paso sin bloquear; marca el paso actual como visitado para mostrar sus pendientes
function irA(n){
  if(n < 0 || n > 4 || n === step) return;
  S.vis = [...new Set([...(S.vis||[]), step])];
  step = n; showErr = S.vis.includes(n); save(); render(); window.scrollTo(0,0);
}
function pendientesPorPaso(){
  return STEPS.map((t,i) => ({i, t, n: Object.values(VALID[i]()).filter(m => m.trim()).length})).filter(x => x.n);
}
function act(a, el){
  if(a === "next"){ irA(step + 1); return; }
  if(a === "prev"){ irA(step - 1); return; }
  if(a === "reset"){ if(confirm("¿Borrar todo lo diligenciado y empezar de nuevo?")){ clearDraft(); S = blank(); step = 0; showErr = false; render(); } return; }
  if(a === "pick"){ $("#file").click(); return; }
  if(a === "tpl"){ downloadTemplate(); return; }
  if(a === "addrow"){ S.equipos.push(newItem({})); save(); render(); return; }
  if(a === "delrow"){ S.equipos.splice(+el.dataset.i,1); save(); render(); return; }
  if(a === "bulk"){ const v = $("#bulk").value; if(v){ S.equipos.forEach(q=>q.tipo_servicio=v); save(); render(); } return; }
  if(a === "copyprev"){
    const i = +el.dataset.i, p = S.equipos[i-1], q = S.equipos[i];
    for(const k of ["tipo_servicio","conformidad","emp","origen_emp","incertidumbre"]) q[k] = p[k];
    q._tocado = true;
    if(!PUNTOS_FIJOS[q.magnitud] || p.magnitud === q.magnitud){ q.puntos = p.puntos; q.psel = [...(p.psel||[])]; q.pinv = []; q.praw = p.puntos; if(unidPts(q.magnitud).includes(p.pts_uni)) q.pts_uni = p.pts_uni; }
    save(); render(); return;
  }
  if(a === "samedir"){ Object.assign(S.sitio,{direccion:S.cliente.direccion,ciudad:S.cliente.ciudad,contacto:S.cliente.contacto}); save(); render(); return; }
  if(a === "gen"){
    errs = VALID.reduce((o,f)=>Object.assign(o,f()),{});
    if(Object.keys(errs).length){ S.vis = [0,1,2,3,4]; showErr = true; render(); document.getElementById("pend")?.scrollIntoView({behavior:"smooth"}); return; }
    generate(); return;
  }
  if(a === "upload"){ if(/^https:\/\//.test(FILE_REQUEST_URL)) window.open(FILE_REQUEST_URL,"_blank","noopener"); else alert("El enlace de carga no está configurado. Comuníquese con su ejecutiva comercial."); return; }
  if(a === "print"){ window.print(); return; }
  if(a === "buscarnit"){ buscarNit(); return; }
  if(a === "listo"){ S._enviado = true; render(); window.scrollTo(0,0); return; }
  if(a === "nueva"){ if(S._enviado || confirm("¿Ya subió el archivo de esta solicitud? Se limpiará el formulario para una nueva.")){ clearDraft(); S = blank(); step = 0; showErr = false; render(); window.scrollTo(0,0); } return; }
}
function newItem(o){
  const it = {magnitud:"",equipo:"",marca:"",modelo:"",serie:"",id:"",resolucion:"",ubicacion:"",tipo_servicio:"",puntos:"",conformidad:"",emp:"",origen_emp:"",incertidumbre:""};
  for(const c of COLS) it[c.k] = String(o[c.k] ?? "").trim();
  const m = matchMag(it.magnitud);
  if(m) it.magnitud = m; else if(it.magnitud){ it.magnitud_original = it.magnitud; it.magnitud = ""; }
  applyDefaults(it);
  const sr = separarUnidad(it.resolucion, unidRes(it.magnitud));
  it.resolucion = sr.v; it.res_uni = sr.u; it.res_uinv = sr.u ? "" : sr.ut;
  const ru = String(o.res_uni ?? "").trim();
  if(ru && norm(ru) !== "no aplica"){ const u = buscarUnidad(unidRes(it.magnitud), ru); it.res_uni = u; it.res_uinv = u ? "" : ru; }
  ajustarUnidades(it);
  it.praw = String(o.puntos ?? "").trim();
  parsePuntos(it, it.praw);
  const pu = String(o.pts_uni ?? "").trim();
  if(pu && !PUNTOS_FIJOS[it.magnitud] && !["no aplica","lista cerrada"].includes(norm(pu))){ const u = buscarUnidad(unidPts(it.magnitud), pu); if(u){ it.pts_uni = u; it.pts_uinv = ""; } else { it.pts_uni = ""; it.pts_uinv = pu; } }
  // Servicio
  const sv = String(o.servicio ?? "").trim();
  if(sv){ it.tipo_servicio = matchServicio(sv); if(!it.tipo_servicio) it.servicio_original = sv; }
  // Declaración de conformidad: si el archivo la trae, manda sobre la regla por magnitud
  const cf = siNo(o.conf), emp = String(o.emp ?? "").trim(), og = String(o.origen ?? "").trim(), inc = siNo(o.incert);
  if(cf){
    it.conformidad = cf; it._tocado = true;
    if(cf === "NO"){ it.emp = ""; it.origen_emp = ""; it.incertidumbre = ""; }
  }
  if(it.conformidad === "SI"){
    if(emp) it.emp = emp; else if(cf) it.emp = it.emp || "";
    if(og){ const o2 = CAT.orig.find(x => norm(x) === norm(og)) || CAT.orig.find(x => norm(x).startsWith(norm(og))); it.origen_emp = o2 && o2 !== "N/A" ? o2 : ""; }
    if(inc) it.incertidumbre = inc === "SI" ? "Si" : "No";
  }
  return it;
}
function matchMag(v){
  const n = norm(v); if(!n) return "";
  if(MAG_BY_NORM.has(n)) return MAG_BY_NORM.get(n);
  const hits = CAT.mag.filter(m => { const mn = norm(m.n); return mn.startsWith(n) || (n.length >= 6 && mn.includes(n)); });
  return hits.length === 1 ? hits[0].n : "";
}

/* ====== ARCHIVOS ====== */
function decodeText(buf){
  try{ return new TextDecoder("utf-8",{fatal:true}).decode(buf); }catch(e){ return new TextDecoder("windows-1252").decode(buf); }
}
function readFile(f){
  const msg = $("#loadmsg");
  if(typeof XLSX === "undefined"){ msg.innerHTML = `<div class="note err">No se pudo cargar el lector de archivos. Revise su conexión a internet y recargue la página.</div>`; return; }
  const rd = new FileReader();
  rd.onload = () => {
    try{
      let wb;
      if(/\.(csv|txt)$/i.test(f.name)){
        const txt = decodeText(new Uint8Array(rd.result)).replace(/^﻿/,"");
        const first = txt.split(/\r?\n/)[0] || "";
        const fs = (first.split(";").length > first.split(",").length) ? ";" : (first.includes("\t") ? "\t" : ",");
        wb = XLSX.read(txt, {type:"string", FS:fs, raw:true});
      } else {
        wb = XLSX.read(rd.result, {type:"array"});
      }
      const ws = wb.Sheets["Equipos"] || wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:"", raw:false, blankrows:false});
      importRows(rows, f.name);
    }catch(e){ msg.innerHTML = `<div class="note err">No se pudo leer el archivo: ${esc(e.message)}</div>`; }
  };
  rd.readAsArrayBuffer(f);
}
function importRows(rows, name){
  const msg = $("#loadmsg");
  // busca la fila de encabezados entre las primeras 10
  let hi = -1, map = null;
  for(let r=0; r<Math.min(10, rows.length); r++){
    const m = {}; rows[r].forEach((h,ci) => { const n = norm(h); const c = COLS_IMPORT.find(c => c.al.includes(n)); if(c && m[c.k] === undefined) m[c.k] = ci; });
    if(m.marca !== undefined && m.modelo !== undefined){ hi = r; map = m; break; }
  }
  if(hi < 0){ msg.innerHTML = `<div class="note err">No se encontraron los encabezados. El archivo debe tener las columnas: ${COLS.map(c=>c.t).join(", ")}. Use «Descargar plantilla».</div>`; return; }
  const missing = COLS.filter(c => map[c.k] === undefined && c.k !== "ubicacion" && c.k !== "id");
  const data = rows.slice(hi+1)
    .map(r => { const o = {}; COLS_IMPORT.forEach(c => { o[c.k] = map[c.k] !== undefined ? r[map[c.k]] : ""; }); return o; })
    .filter(o => COLS.some(c => String(o[c.k]).trim()));
  if(!data.length){ msg.innerHTML = `<div class="note err">El archivo no tiene filas con datos debajo de los encabezados.</div>`; return; }
  if(data.length > MAX_ITEMS){ msg.innerHTML = `<div class="note err">El archivo tiene ${data.length} equipos; el máximo por solicitud es ${MAX_ITEMS}. Divídalo en varias solicitudes.</div>`; return; }
  if(S.equipos.length && !confirm(`Ya hay ${S.equipos.length} equipo(s) en la tabla. ¿Reemplazarlos por los ${data.length} del archivo?`)) return;
  S.equipos = data.map(newItem); S.archivo = name; showErr = true; save(); render();
  if(missing.length) $("#loadmsg").innerHTML = `<div class="note warn">Columnas no encontradas en el archivo: ${missing.map(c=>c.t).join(", ")}. Complételas en la tabla.</div>`;
}
function downloadTemplate(){
  // Plantilla Excel generada con lista desplegable de magnitudes en la columna A
  const bin = atob(PLANTILLA_B64), buf = new Uint8Array(bin.length);
  for(let k=0; k<bin.length; k++) buf[k] = bin.charCodeAt(k);
  const blob = new Blob([buf], {type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "Plantilla_equipos_PCO-FO-04.xlsx";
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 5000);
}

const ND = "No disponible";
const nd = v => String(v ?? "").trim() || ND;
const conUnidad = (v, u) => { v = String(v ?? "").trim(); if(!v || norm(v) === "no disponible") return ND; return u ? v + " " + u : v; };
function generate(){
  const now = new Date();
  const pad = n => String(n).padStart(2,"0");
  const stamp = `${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}-${pad(now.getHours())}${pad(now.getMinutes())}`;
  const nit = S.cliente.nit.replace(/[^\d-]/g,"");
  const fname = `SOL_${EJ}_${nit}_${stamp}.json`;
  const out = {
    formato:"PCO-FO-04", origen:"solicitud-web", version_app:APP_VERSION,
    fecha_diligenciamiento: now.toISOString(),
    fecha_local: `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}`,
    ejecutiva:{iniciales:EJ, nombre:EJ_OBJ.n},
    cliente_nuevo: (S.base||{}).estado === "nuevo",
    cliente:Object.assign({}, S.cliente, {orden:nd(S.cliente.orden), correo_facturas: S.cliente.fact_mismo === "SI" ? S.cliente.correo : S.cliente.correo_facturas}), resultados:S.resultados, lugar:S.lugar,
    equipos:S.equipos.map((q,i)=>({item:i+1, magnitud:q.magnitud, equipo:q.equipo, marca:q.marca, modelo:q.modelo, serie:nd(q.serie), id:nd(q.id),
      resolucion:conUnidad(q.resolucion, q.res_uni), ubicacion:nd(q.ubicacion), requisitos:reqOf(q.magnitud), tipo_servicio:q.tipo_servicio, puntos:(PUNTOS_FIJOS[q.magnitud] ? puntosFijosTexto(q) : conUnidad(String(q.puntos||"").replace(/\s*[;|]\s*/g,"\\"), q.pts_uni)),
      declaracion_conformidad: q.conformidad==="SI" ? CAT.decl.si : CAT.decl.no,
      emp: q.conformidad==="SI" ? q.emp : "", origen_emp: q.conformidad==="SI" ? q.origen_emp : "N/A",
      incertidumbre: q.conformidad==="SI" ? q.incertidumbre : ""})),
    sitio: enSitio() ? Object.assign({}, S.sitio, {otras:nd(S.sitio.otras)}) : null,
    notas:nd(S.notas), acepta_condiciones:S.acepta
  };
  const blob = new Blob([JSON.stringify(out,null,2)], {type:"application/json"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = fname;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 5000);
  S._generado = fname; clearDraft(); render();
  document.getElementById("envio")?.scrollIntoView({behavior:"smooth"});
}

/* ====== BASE DE CLIENTES CIFRADA (clientes.dat) ====== */
const ITER_BASE = 25000;
const te = new TextEncoder();
const b64d = t => Uint8Array.from(atob(t), c => c.charCodeAt(0));
const b64e = u => { let x = ""; for(let i = 0; i < u.length; i += 8192) x += String.fromCharCode(...u.subarray(i, i + 8192)); return btoa(x); };
const soloNit = v => String(v ?? "").split("-")[0].replace(/\D/g, "");
function nitCandidatos(raw){
  const s = String(raw ?? "").trim(), n = soloNit(s), c = [];
  if(n.length >= 5) c.push(n);
  if(!s.includes("-") && n.length === 10) c.push(n.slice(0, 9));   // NIT escrito con el dígito de verificación pegado
  return c;
}
async function derivar(nit, salt, it){
  const k = await crypto.subtle.importKey("raw", te.encode("MC|" + nit), "PBKDF2", false, ["deriveBits"]);
  const bits = new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2", salt, iterations:it, hash:"SHA-256"}, k, 384));
  return {idx: [...bits.slice(0, 16)].map(b => b.toString(16).padStart(2, "0")).join(""), key: bits.slice(16, 48)};
}
let BASE = null;
async function cargarBase(){
  if(BASE) return BASE;
  try{ const r = await fetch("clientes.dat?v=" + Date.now(), {cache:"no-store"}); if(!r.ok) return null; BASE = await r.json(); return BASE; }
  catch(e){ return null; }
}
async function buscarEnBase(db, nit){
  const {idx, key} = await derivar(nit, b64d(db.salt), db.it);
  const rec = db.r[idx]; if(!rec) return null;
  const ck = await crypto.subtle.importKey("raw", key, "AES-GCM", false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv: b64d(rec[0])}, ck, b64d(rec[1]));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function buscarNit(){
  const cands = nitCandidatos(S.cliente.nit);
  if(!cands.length){ showErr = true; render(); return; }
  S.base = {estado:"buscando", nombre:"", sedes:[], sede:-2}; render();
  const db = await cargarBase();
  if(!db){ S.base = {estado:"sinbase", nombre:"", sedes:[], sede:-2}; save(); render(); return; }
  for(const c of cands){
    let r = null; try{ r = await buscarEnBase(db, c); }catch(e){}
    if(r){ aplicarCliente(r); return; }
  }
  S.base = {estado:"nuevo", nombre:"", sedes:[], sede:-2}; save(); render();
}
function aplicarCliente(r){
  S.base = {estado:"encontrado", nombre:r.n, sedes:r.s || [], sede:-2};
  S.cliente.nombre = r.n;
  if(S.base.sedes.length === 1) aplicarSede(0); else { S.cliente.direccion = ""; S.cliente.cotizacion = ""; save(); render(); }
}
function aplicarSede(i){
  const b = S.base, c = S.cliente; b.sede = i;
  if(i >= 0){
    const x = b.sedes[i];
    c.direccion = x.dir || ""; c.ciudad = x.ciu || c.ciudad; c.sede = x.sede || "";
    if(x.con) c.contacto = x.con; if(x.cor) c.correo = x.cor; if(x.cfe){ c.correo_facturas = x.cfe; c.fact_mismo = x.cfe === c.correo ? "SI" : "NO"; }
  } else { c.direccion = ""; c.sede = i === -1 ? "Otra sede" : ""; }
  const cots = cotizacionesDisponibles();
  c.cotizacion = cots.length === 1 ? cots[0] : (cots.includes(c.cotizacion) ? c.cotizacion : "");
  save(); render();
}
function cotizacionesDisponibles(){
  const b = S.base || {};
  if(b.estado !== "encontrado") return [];
  if(b.sede >= 0) return (b.sedes[b.sede] || {}).cot || [];
  if(b.sede === -1) return [...new Set(b.sedes.flatMap(x => x.cot || []))];
  return [];
}

/* ====== PANTALLA INTERNA ?admin: genera clientes.dat ====== */
/* Acepta: (a) Terceros (software contable) + Base de cotizaciones, o (b) el Excel maestro Clientes_PCO-FO-04 */
let ADMIN_DB = null, ADMIN_INF = [];
const DEPTO_DANE = {"05":"Antioquia","08":"Atlántico","11":"Bogotá D.C.","13":"Bolívar","15":"Boyacá","17":"Caldas","18":"Caquetá","19":"Cauca","20":"Cesar","23":"Córdoba","25":"Cundinamarca","27":"Chocó","41":"Huila","44":"La Guajira","47":"Magdalena","50":"Meta","52":"Nariño","54":"Norte de Santander","63":"Quindío","66":"Risaralda","68":"Santander","70":"Sucre","73":"Tolima","76":"Valle del Cauca","81":"Arauca","85":"Casanare","86":"Putumayo","88":"Archipiélago de San Andrés, Providencia y Santa Catalina","91":"Amazonas","94":"Guainía","95":"Guaviare","97":"Vaupés","99":"Vichada"};
const MUN_IDX = (() => { const m = new Map(); CAT.mun.forEach(x => { const [c, d] = x.split(" - "); const k = norm(c); if(!m.has(k)) m.set(k, []); m.get(k).push({x, d: norm(d)}); }); return m; })();
// Ciudad del software (nombre + código DANE) -> formato de la página "Ciudad - Departamento"
function ciudadOficial(nombre, codigo, depto){
  let n = norm(nombre).replace(/\bd c\b/g, "").trim(); if(n.startsWith("bogota")) return "Bogotá D.C. - Bogotá D.C.";
  const cod = String(codigo ?? "").replace(/\D/g, "").padStart(5, "0");
  const dep = norm(DEPTO_DANE[cod.slice(0, 2)] || depto || "");
  const c = MUN_IDX.get(n) || [];
  return (c.find(y => y.d === dep) || (c.length === 1 ? c[0] : null) || {}).x || "";
}
// Ciudad escrita a mano en la cotización ("BOGOTA", "Cota", "Soacha/ Cundinamarca")
function ciudadTexto(t){
  const s = String(t ?? "").split(/[\/\-]/)[0]; const n = norm(s).replace(/\bd c\b/g, "").trim();
  if(!n) return ""; if(n.startsWith("bogota")) return "Bogotá D.C. - Bogotá D.C.";
  const c = MUN_IDX.get(n) || []; return c.length ? (c.find(y => y.d === "cundinamarca") || c[0]).x : "";
}
function ciudadEnTexto(t){
  const n = " " + norm(t) + " "; if(!n.trim()) return "";
  if(/ bogota /.test(n)) return "Bogotá D.C. - Bogotá D.C.";
  let mejor = null;
  MUN_IDX.forEach((lista, k) => { if(k.length > 3 && n.includes(" " + k + " ") && (!mejor || k.length > mejor.k.length)) mejor = {k, lista}; });
  return mejor ? (mejor.lista.find(y => y.d === "cundinamarca") || mejor.lista[0]).x : "";
}
// Dígito de verificación DIAN
function dvNit(n){ const p = [3,7,13,17,19,23,29,37,41,43,47,53,59,67,71]; let s = 0; [...n].reverse().forEach((d, i) => s += (+d) * p[i]); const r = s % 11; return r < 2 ? r : 11 - r; }
function nitBase(v){ const d = String(v ?? "").replace(/\D/g, ""); return d.length === 10 && dvNit(d.slice(0, 9)) === +d[9] ? d.slice(0, 9) : d; }
// Nombre comparable: sin tildes, sin signos ni formas societarias
const SUFIJOS = /\b(s ?a ?s|s ?a|ltda|limitada|e ?s ?p|y cia|cia|sociedad|por acciones|simplificada|ci|c i|de c ?v|sas|s en c)\b/g;
const nombreClave = t => norm(t).replace(SUFIJOS, " ").replace(/\b\d+\b/g, " ").replace(/\s+/g, " ").trim();
function parecidos(a, b){ if(nombreClave(a) === nombreClave(b)) return 1; const A = new Set(nombreClave(a).split(" ").filter(x => x.length > 2)), B = new Set(nombreClave(b).split(" ").filter(x => x.length > 2)); if(!A.size || !B.size) return 0; let c = 0; A.forEach(x => B.has(x) && c++); return c / Math.min(A.size, B.size); }
// Dirección comparable: misma dirección escrita de distintas formas -> misma clave
const VIAS = {cl:"calle",cll:"calle",calle:"calle",cr:"carrera",cra:"carrera",kr:"carrera",kra:"carrera",carrera:"carrera",carera:"carrera",av:"avenida",avenida:"avenida",ak:"avenida carrera",ac:"avenida calle",tv:"transversal",transversal:"transversal",dg:"diagonal",diagonal:"diagonal",km:"kilometro",kilometro:"kilometro",aut:"autopista",autopista:"autopista"};
const CORTE = new Set(["of","oficina","bodega","bg","int","in","interior","to","torre","p","piso","apto","apartamento","local","lc","barrio","brr","ed","edificio","casa","mz","manzana"]);
function claveDir(d){
  const t = norm(String(d ?? "").split("\\")[0]).replace(/(\d)([a-z])/g, "$1 $2").replace(/([a-z])(\d)/g, "$1 $2").split(" ").filter(x => x && !["no","n","numero","bis"].includes(x));
  const k = []; for(const x of t){ if(CORTE.has(x)) break; k.push(VIAS[x] || x); }
  return k.slice(0, 7).join(" ");
}
const esDireccion = d => { const t = String(d ?? "").split("\\")[0].trim(); return t.length >= 6 && !placeholderReason(t) && !ciudadTexto(t); };
const dirLimpia = d => String(d ?? "").split("\\")[0].replace(/\s+/g, " ").replace(/\s*\(!\)\s*/g, " ").trim();
const nombreSede = (ciu, dir) => { const d = String(dir ?? ""); return (ciu ? ciu.split(" - ")[0] : "Sin ciudad") + " – " + (d.length > 60 ? d.slice(0, 57).trim() + "…" : d); };

function renderAdmin(){
  $("#app").innerHTML = `<div class="card"><h2>Actualizar base de clientes</h2>
    <p class="lead">Uso interno. Arrastre <b>los dos archivos</b>: el de <b>Terceros</b> del software contable y la <b>Base de cotizaciones</b>, tal como salen. Los archivos no salen de su computador: aquí se cotejan, se cifran y se descarga <b>clientes.dat</b> para subirlo a GitHub.</p>
    <div class="drop" id="adrop"><p style="margin:0 0 10px"><b>Arrastre aquí los dos archivos</b> (.xls o .xlsx) o</p><button class="btn" id="apick">Seleccionar archivos</button><input type="file" id="afile" accept=".xlsx,.xls" multiple class="hidden"></div>
    <div id="aout" style="margin-top:12px"></div></div>`;
  const f = $("#afile"), d = $("#adrop");
  $("#apick").onclick = () => f.click();
  f.onchange = e => adminLeer([...e.target.files]);
  ["dragenter","dragover"].forEach(t => d.addEventListener(t, e => { e.preventDefault(); d.classList.add("over"); }));
  ["dragleave","drop"].forEach(t => d.addEventListener(t, e => { e.preventDefault(); d.classList.remove("over"); }));
  d.addEventListener("drop", e => adminLeer([...e.dataTransfer.files]));
}
const leerLibro = file => new Promise((ok, mal) => { const r = new FileReader(); r.onload = () => { try{ ok(XLSX.read(r.result, {type:"array", cellDates:false})); }catch(e){ mal(e); } }; r.onerror = mal; r.readAsArrayBuffer(file); });
const filasDe = ws => XLSX.utils.sheet_to_json(ws, {header:1, defval:"", raw:false, blankrows:false});
function clasificar(wb){
  for(const n of wb.SheetNames){
    const f = filasDe(wb.Sheets[n]);
    const hi = f.slice(0, 15).findIndex(r => r.some(c => norm(c) === "identificacion") && r.some(c => norm(c) === "nombre fiscal"));
    if(hi >= 0) return {tipo:"terceros", filas:f, hi};
    if(f.filter(r => /^\d{2}-\d{3,}$/.test(String(r[0]).trim())).length >= 3) return {tipo:"cotizaciones", filas:f};
    if(norm(n) === "clientes" && f[0] && f[0].some(c => norm(c).startsWith("nit")) && f[0].some(c => norm(c).startsWith("razon social"))) return {tipo:"maestro", libro:wb};
  }
  return {tipo:"desconocido"};
}
async function adminLeer(files){
  const out = $("#aout");
  if(typeof XLSX === "undefined"){ out.innerHTML = `<div class="note err">No se pudo cargar el lector de Excel. Revise su conexión.</div>`; return; }
  try{
    const lib = await Promise.all(files.map(leerLibro)), cl = lib.map(clasificar);
    const ter = cl.find(x => x.tipo === "terceros"), cot = cl.find(x => x.tipo === "cotizaciones"), mae = cl.find(x => x.tipo === "maestro");
    let g;
    if(ter && cot) g = cotejar(ter, cot);
    else if(mae) g = desdeMaestro(mae.libro);
    else throw new Error(ter ? "Falta el archivo de cotizaciones." : cot ? "Falta el archivo de Terceros." : "No reconocí los archivos. Arrastre el de Terceros y el de cotizaciones.");
    await generarDat(g);
  }catch(e){ out.innerHTML = `<div class="note err">${esc(e.message)}</div>`; }
}

/* ---- Cotejo Terceros + Cotizaciones ---- */
function cotejar(ter, cot){
  ADMIN_INF = [];
  const inf = (tipo, detalle, extra = {}) => ADMIN_INF.push(Object.assign({tipo, detalle}, extra));
  // 1. Terceros: solo clientes
  const H = ter.filas[ter.hi].map(norm), col = (...k) => H.findIndex(h => k.some(x => h.startsWith(x)));
  const iId = col("identificacion"), iNom = col("nombre fiscal"), iCom = col("nombre comercial"), iCli = col("indicador cliente"),
        iD1 = col("direccion 1"), iD2 = col("direccion 2"), iD3 = col("direccion 3"), iE1 = col("email 1"), iDep = col("departamento"),
        iCiu = H.findIndex(h => h === "ciudad"), iCod = col("codigo ciudad");
  const clientes = new Map(), porNombre = new Map();
  ter.filas.slice(ter.hi + 1).forEach((r, k) => {
    const nit = String(r[iId] ?? "").replace(/\D/g, ""); if(!nit) return;
    if(iCli >= 0 && !norm(r[iCli]).startsWith("si")) return;                 // solo clientes
    const nombre = String(r[iNom] || r[iCom] || "").trim();
    const dir = [r[iD1], r[iD2], r[iD3]].map(x => String(x ?? "").trim()).filter(Boolean).join(" ");
    const ciu = ciudadOficial(r[iCiu], r[iCod], r[iDep]);
    if(!ciu) inf("Ciudad no reconocida", `Terceros fila ${ter.hi + k + 2}: «${r[iCiu]}» (código ${r[iCod]})`, {nit, cliente:nombre});
    clientes.set(nit, {n: nombre, alt: String(r[iCom] ?? "").trim(), dirP: dir, ciuP: ciu, corP: String(r[iE1] ?? "").split(/[;,]/)[0].trim(), sedes: new Map(), con: "", cor: "", fcon: -1});
    porNombre.set(nombreClave(nombre), nit);
    if(iCom >= 0 && String(r[iCom] ?? "").trim()) porNombre.set(nombreClave(r[iCom]), nit);
  });
  // 2. Cotizaciones del año en curso
  const anio = String(new Date().getFullYear()).slice(2);
  let nCot = 0, nFuera = 0;
  cot.filas.forEach(r => {
    const num = String(r[0]).trim(); if(!/^\d{2}-\d{3,}$/.test(num)) return;
    if(num.slice(0, 2) !== anio){ nFuera++; return; }
    const nomC = String(r[2] ?? "").trim(), raw = String(r[5] ?? "").trim(), fecha = +r[1] || 0;
    // Llave: NIT sin DV -> reparaciones -> nombre
    const d = raw.replace(/\D/g, ""), cands = [nitBase(raw), d, d.slice(0, 9), d.slice(0, 10), d.slice(0, -1)].filter((x, i, a) => x && a.indexOf(x) === i);
    let nit = cands.find(x => clientes.has(x)), como = "";
    if(nit && nit !== nitBase(raw)) como = `NIT reparado: ${raw} → ${nit}`;
    if(!nit){ const n2 = porNombre.get(nombreClave(nomC)); if(n2){ nit = n2; como = `NIT ${raw || "(vacío)"} reparado por nombre → ${nit}`; } }
    if(!nit){ inf("Cliente no está en Terceros", `${nomC} · NIT ${raw}`, {cotizacion:num}); return; }
    const c = clientes.get(nit);
    if(como) inf("NIT reparado", como, {cotizacion:num, nit, cliente:c.n});
    else if(Math.max(parecidos(nomC, c.n), c.alt ? parecidos(nomC, c.alt) : 0) < 0.34) inf("Nombre distinto al de Terceros", `Cotización: «${nomC}» · Terceros: «${c.n}»`, {cotizacion:num, nit});
    // Sede: dirección normalizada distinta de la principal
    const dirC = String(r[4] ?? ""), kC = claveDir(dirC), kP = claveDir(c.dirP);
    let sede = "P";
    if(esDireccion(dirC) && kC && kC !== kP){
      if(!c.sedes.has(kC)){
        const ciu = ciudadTexto(dirC.split("\\")[1]) || ciudadEnTexto(dirC.split("\\")[1]) || ciudadEnTexto(dirC.split("\\")[0]) || ciudadTexto(r[9]) || c.ciuP;
        c.sedes.set(kC, {dir: dirLimpia(dirC), ciu, cot: []});
        inf("Sede adicional detectada", `${c.n}: ${nombreSede(ciu, dirLimpia(dirC))} (principal: ${c.dirP})`, {cotizacion:num, nit});
      }
      sede = kC;
    } else if(dirC.trim() && !esDireccion(dirC)) inf("Dirección no válida", `«${dirLimpia(dirC)}» no es una dirección; se asignó a la sede principal`, {cotizacion:num, nit, cliente:c.n});
    if(sede === "P"){ c.cotP = c.cotP || []; if(!c.cotP.includes(num)) c.cotP.push(num); }
    else { const s = c.sedes.get(sede); if(!s.cot.includes(num)) s.cot.push(num); }
    // Contacto y correo de la cotización más reciente (col. J si es un nombre y no una ciudad)
    if(fecha >= c.fcon){
      const j = String(r[9] ?? "").trim(), cor = String(r[7] ?? "").split(/[;,\s]/).find(x => x.includes("@")) || "";
      const j1 = j.split(/\\|;|\//)[0].trim();
      if(j1 && !ciudadTexto(j1) && !placeholderReason(j1)){ c.con = j1; c.fcon = fecha; }
      if(cor) c.cor = cor;
    }
    nCot++;
  });
  // 3. Estructura para la página
  const g = new Map();
  clientes.forEach((c, nit) => {
    const s = [{sede: nombreSede(c.ciuP, c.dirP), dir: c.dirP, ciu: c.ciuP, con: c.con, cor: c.cor || c.corP, cfe: "", cot: (c.cotP || []).sort().reverse()}];
    c.sedes.forEach(x => s.push({sede: nombreSede(x.ciu, x.dir), dir: x.dir, ciu: x.ciu, con: c.con, cor: c.cor || c.corP, cfe: "", cot: x.cot.sort().reverse()}));
    g.set(nit, {n: c.n, s});
  });
  g._resumen = `${clientes.size} clientes de Terceros · ${nCot} cotizaciones del 20${anio} cotejadas${nFuera ? ` · ${nFuera} de otros años excluidas` : ""}`;
  return g;
}

/* ---- Excel maestro Clientes_PCO-FO-04 (formato anterior) ---- */
function desdeMaestro(wb){
  ADMIN_INF = [];
  const hoja = n => { const k = wb.SheetNames.find(x => norm(x) === norm(n)); return k ? filasDe(wb.Sheets[k]) : null; };
  const cl = hoja("Clientes"), co = hoja("Cotizaciones") || [];
  const col = (hdr, ...claves) => hdr.findIndex(h => claves.some(c => norm(h).startsWith(c)));
  const H = cl[0], iN = col(H,"nit"), iS = col(H,"sede"), iR = col(H,"razon social"), iD = col(H,"direccion"), iC = col(H,"ciudad"), iP = col(H,"persona de contacto","contacto"), iE = col(H,"correo de contacto","correo contacto");
  const g = new Map();
  cl.slice(1).forEach((r, k) => {
    const nit = nitBase(r[iN]); if(!nit) return;
    const ciu = String(r[iC] ?? "").trim(); if(ciu && !MUN_SET.has(ciu)) ADMIN_INF.push({tipo:"Ciudad no reconocida", detalle:`Clientes fila ${k+2}: «${ciu}»`});
    if(!g.has(nit)) g.set(nit, {n: String(r[iR]).trim(), s: []});
    const x = g.get(nit);
    x.s.push({sede: String(iS >= 0 ? r[iS] : "").trim() || nombreSede(ciu, String(r[iD] ?? "").trim()), dir: String(r[iD] ?? "").trim(), ciu, con: String(iP>=0 ? r[iP] : "").trim(), cor: String(iE>=0 ? r[iE] : "").trim(), cfe: "", cot: []});
  });
  if(co.length){
    const Q = co[0], qN = col(Q,"nit"), qS = col(Q,"sede"), qQ = col(Q,"numero","cotizacion"), qE = col(Q,"estado");
    co.slice(1).forEach((r, k) => {
      const nit = nitBase(r[qN]), num = String(r[qQ] ?? "").trim(); if(!nit || !num) return;
      if(qE >= 0 && norm(r[qE]) !== "vigente") return;
      const x = g.get(nit); if(!x){ ADMIN_INF.push({tipo:"Cliente no está en Clientes", detalle:`Cotizaciones fila ${k+2}: NIT ${nit}`}); return; }
      const sede = String(qS >= 0 ? r[qS] : "").trim(), dest = sede ? x.s.filter(y => norm(y.sede) === norm(sede)) : x.s;
      dest.forEach(y => { if(!y.cot.includes(num)) y.cot.push(num); });
    });
  }
  g._resumen = `${g.size} clientes desde el Excel maestro`;
  return g;
}

/* ---- Cifrado y descarga ---- */
async function generarDat(g){
  const out = $("#aout");
  const salt = crypto.getRandomValues(new Uint8Array(16)), db = {v:1, it:ITER_BASE, salt:b64e(salt), fecha:new Date().toISOString().slice(0,10), r:{}};
  let i = 0;
  for(const [nit, x] of g){
    const {idx, key} = await derivar(nit, salt, ITER_BASE);
    const ck = await crypto.subtle.importKey("raw", key, "AES-GCM", false, ["encrypt"]);
    const iv = crypto.getRandomValues(new Uint8Array(12));
    db.r[idx] = [b64e(iv), b64e(new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM", iv}, ck, te.encode(JSON.stringify(x)))))];
    if(++i % 25 === 0) out.innerHTML = `<div class="note">Cifrando… ${i} de ${g.size} clientes</div>`;
  }
  ADMIN_DB = db;
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([JSON.stringify(db)], {type:"application/octet-stream"})); a.download = "clientes.dat"; document.body.appendChild(a); a.click(); a.remove();
  const grupos = {}; ADMIN_INF.forEach(x => (grupos[x.tipo] = grupos[x.tipo] || []).push(x));
  const sedes = [...g.values()].reduce((t, x) => t + x.s.length, 0), cots = [...g.values()].reduce((t, x) => t + x.s.reduce((u, s) => u + s.cot.length, 0), 0);
  out.innerHTML = `<div class="note ok"><b>clientes.dat</b> descargado. ${esc(g._resumen)}. Quedaron ${g.size} clientes, ${sedes} sedes y ${cots} cotizaciones.<br>Súbalo a GitHub (Add file → Upload files) en el mismo repositorio del index.html.</div>
    ${ADMIN_INF.length ? `<div class="note warn"><b>Informe de cotejo (${ADMIN_INF.length})</b> — revise y corrija en el origen:
      <ul style="margin:6px 0 0;padding-left:18px">${Object.entries(grupos).map(([t, l]) => `<li><b>${esc(t)}</b>: ${l.length}</li>`).join("")}</ul>
      <button class="btn sec small" id="ainf" style="margin-top:8px">Descargar informe en Excel</button></div>` : ""}
    <div class="f" style="max-width:420px;margin-top:10px"><label>Probar un NIT</label><div class="nitrow"><input type="text" id="anit" placeholder="NIT"><button class="btn sec" id="aprobar">Probar</button></div></div><pre id="ares" class="link" style="white-space:pre-wrap;display:none"></pre>`;
  const bi = $("#ainf"); if(bi) bi.onclick = () => {
    const wb = XLSX.utils.book_new(), ws = XLSX.utils.json_to_sheet(ADMIN_INF.map(x => ({Tipo:x.tipo, Cotización:x.cotizacion||"", NIT:x.nit||"", Cliente:x.cliente||"", Detalle:x.detalle})));
    ws["!cols"] = [{wch:30},{wch:12},{wch:14},{wch:40},{wch:100}]; XLSX.utils.book_append_sheet(wb, ws, "Informe");
    XLSX.writeFile(wb, "Informe_cotejo_" + db.fecha + ".xlsx");
  };
  $("#aprobar").onclick = async () => {
    let r = null; for(const c of nitCandidatos($("#anit").value)){ r = await buscarEnBase(ADMIN_DB, c).catch(() => null); if(r) break; }
    const pre = $("#ares"); pre.style.display = "block"; pre.textContent = r ? JSON.stringify(r, null, 2) : "NIT no encontrado";
  };
}
