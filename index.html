<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solicitud de Servicios</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --navy:#1B3A6B; --blue:#0072BC; --sky:#00AEEF; --gold:#E8B10E;
  --bg:#F4F6FA; --card:#FFFFFF; --ink:#1C2430; --muted:#5F6B7A; --line:#D9DFE8;
  --err:#C62828; --errbg:#FDECEC; --ok:#2E7D32; --okbg:#E8F5E9; --warnbg:#FFF6DB;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Segoe UI",Roboto,Arial,sans-serif}
header{background:var(--card);border-bottom:4px solid var(--navy)}
.hwrap{max-width:1100px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.hwrap img{height:44px}
.htitle{flex:1;min-width:200px}
.htitle h1{margin:0;font-size:20px;color:var(--navy)}
.htitle small{color:var(--muted)}
.code{font:600 12px/1.3 Consolas,monospace;color:var(--navy);text-align:right}
main{max-width:1100px;margin:0 auto;padding:16px}
.steps{display:flex;gap:6px;margin:4px 0 16px;flex-wrap:wrap}
.steps div{flex:1;min-width:120px;padding:8px 10px;border-radius:6px;background:#E6EAF1;color:var(--muted);font-size:13px;font-weight:600}
.steps div.on{background:var(--navy);color:#fff}
.steps div.done{background:#CFE3F5;color:var(--navy)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:16px}
.card h2{margin:0 0 4px;font-size:17px;color:var(--navy)}
.card p.lead{margin:0 0 14px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px 16px}
.f{display:flex;flex-direction:column;gap:4px}
.f label{font-size:13px;font-weight:600}
.f label .req{color:var(--err)}
input[type=text],input[type=email],input[type=tel],select,textarea{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);width:100%}
textarea{min-height:64px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--sky);border-color:var(--sky)}
.bad{border-color:var(--err)!important;background:var(--errbg)!important}
.msg{color:var(--err);font-size:12px}
.hint{color:var(--muted);font-size:12px}
.btn{font:600 14px/1 inherit;font-family:inherit;padding:10px 16px;border-radius:6px;border:1px solid var(--navy);background:var(--navy);color:#fff;cursor:pointer}
.btn.sec{background:#fff;color:var(--navy)}
.btn.small{padding:6px 10px;font-size:13px}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1C2430}
.btn:disabled{opacity:.5;cursor:not-allowed}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:8px;flex-wrap:wrap}
.radios{display:flex;gap:8px;flex-wrap:wrap}
.radios label{display:flex;gap:6px;align-items:center;padding:8px 12px;border:1px solid var(--line);border-radius:6px;cursor:pointer;font-weight:500;background:#fff}
.radios label.sel{border-color:var(--blue);background:#E7F2FB}
.note{padding:10px 12px;border-radius:6px;background:#E7F2FB;border-left:4px solid var(--blue);font-size:14px;margin:10px 0}
.note.warn{background:var(--warnbg);border-color:var(--gold)}
.note.err{background:var(--errbg);border-color:var(--err)}
.note.ok{background:var(--okbg);border-color:var(--ok)}
.drop{border:2px dashed var(--line);border-radius:10px;padding:22px;text-align:center;background:#FAFBFD}
.drop.over{border-color:var(--blue);background:#E7F2FB}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;margin-top:12px}
table{border-collapse:collapse;width:100%;min-width:980px}
th,td{border-bottom:1px solid var(--line);padding:6px;vertical-align:top;text-align:left}
th{background:#EEF2F8;font-size:12px;color:var(--navy);position:sticky;top:0}
td input,td select{padding:6px 7px;font-size:13px}
td .msg{display:block;margin-top:2px}
td.n{font-weight:700;color:var(--navy);width:34px}
.errlist{max-height:180px;overflow:auto;margin:8px 0 0;padding-left:18px;font-size:13px;color:var(--err)}
.item{border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:12px}
.item h3{margin:0 0 2px;font-size:15px;color:var(--navy)}
.item .sub{color:var(--muted);font-size:13px;margin-bottom:8px}
.req-box{font-size:13px;background:#F6F8FB;border-radius:6px;padding:6px 8px;margin-bottom:10px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:end;padding:10px;background:#F6F8FB;border-radius:8px;margin-bottom:12px}
.toolbar .f{min-width:220px}
.epp{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:6px}
.epp label{display:flex;gap:8px;align-items:center;font-size:14px}
.sum dt{font-weight:600;color:var(--navy);margin-top:6px}
.sum dd{margin:0 0 4px}
.link{word-break:break-all;font:13px Consolas,monospace;background:#F6F8FB;padding:8px;border-radius:6px;border:1px solid var(--line)}
.hidden{display:none!important}
@media print{header .code,.steps,.nav,.noprint{display:none!important}body{background:#fff}.card{border:none}}
</style>
</head>

function placeholderReason(v){
  const raw = String(v ?? "").trim();
  if(!raw) return null;
  if(!/[A-Za-z0-9]/.test(raw)) return "solo contiene símbolos";
  const n = norm(raw);
  if(PH_EXACT.has(n)) return "«"+raw+"» no es un dato válido";
  for(const re of PH_CONTAINS) if(re.test(n)) return "«"+raw+"» no es un dato válido";
  if(/^(.)\1+$/.test(n.replace(/ /g,""))) return "«"+raw+"» no es un dato válido";
  return null;
}

function vCliente(){
  const e = {}, c = S.cliente, r = S.resultados;
  if(!c.nombre.trim()) e["cliente.nombre"] = "Obligatorio";
  const nit = c.nit.replace(/[.\s]/g,"");

  else if(!/^\d{5,12}(-\d)?$/.test(nit)) e["cliente.nit"] = "Solo números, con dígito de verificación opcional (ej. 900123456-7)";
  if(!c.direccion.trim()) e["cliente.direccion"] = "Obligatorio";
  if(!MUN_SET.has(c.ciudad)) e["cliente.ciudad"] = "Elija una ciudad de la lista";
  if(!c.contacto.trim()) e["cliente.contacto"] = "Obligatorio";
  if(!isEmail(c.correo)) e["cliente.correo"] = "Correo no válido";
  if(!c.cotizacion.trim()) e["cliente.cotizacion"] = "Indique el número de la cotización aceptada";
  if(!isEmail(c.correo_facturas)) e["cliente.correo_facturas"] = "Correo no válido";
  if(!["SI","NO"].includes(r.tercero)) e["resultados.tercero"] = "Seleccione una opción";
  if(r.tercero === "SI"){
    if(!r.nombre.trim()) e["resultados.nombre"] = "Obligatorio";

    if(!MUN_SET.has(r.ciudad)) e["resultados.ciudad"] = "Elija una ciudad de la lista";
  }
  return e;
}
function vEquipoRow(q, i, all){
  const e = {}, p = "eq."+i+".";
  if(!CAT.mag.some(m => m.n === q.magnitud)) e[p+"magnitud"] = q.magnitud_original ? "«"+q.magnitud_original+"» no está en la lista. Elija la magnitud" : "Elija la magnitud";
  for(const k of ["equipo","marca","modelo"]){
    const v = (q[k]||"").trim();
    if(!v){ e[p+k] = "Obligatorio"; continue; }
    const ph = placeholderReason(v);
    if(ph){ e[p+k] = ph + ". Escriba el dato real de la placa del equipo"; continue; }
    if(k !== "equipo" && v.replace(/[^A-Za-z0-9]/g,"").length < 2) e[p+k] = "Demasiado corto";
  }
  const se = (q.serie||"").trim(), id = (q.id||"").trim();
  for(const [k,v] of [["serie",se],["id",id]]){
    const ph = placeholderReason(v);
    if(ph) e[p+k] = ph + ". Si no existe, deje la celda vacía";
  }
  if(!se && !id){ e[p+"serie"] = "Indique la serie o el ID del equipo (al menos uno)"; e[p+"id"] = " "; }
  const res = (q.resolucion||"").trim();
  if(!res && SIN_RESOLUCION.includes(q.magnitud)) {}
  else if(!res) e[p+"resolucion"] = "Obligatorio";
  else if(placeholderReason(res)) e[p+"resolucion"] = placeholderReason(res) + ". Ej.: 0,1 °C · 0,01 g · 1 µL";
  else if(!/\d/.test(res)) e[p+"resolucion"] = "Debe incluir el valor numérico. Ej.: 0,1 °C";
  if(enSitio()){
    const u = (q.ubicacion||"").trim();
    if(!u) e[p+"ubicacion"] = "Obligatorio para servicios en sitio";
    else if(placeholderReason(u)) e[p+"ubicacion"] = placeholderReason(u);
  }
  if(se){
    const dup = all.findIndex((o,j) => j < i && norm(o.serie) === norm(se) && o.magnitud === q.magnitud);
    if(dup >= 0) e[p+"serie"] = "Serie repetida con el equipo "+(dup+1);
  }
  return e;
}

function errHtml(key){ return showErr && errs[key] && errs[key].trim() ? `<span class="msg">${esc(errs[key])}</span>` : ""; }
function bad(key){ return showErr && errs[key] ? " bad" : ""; }
function inp(path, label, opt={}){
  const v = get(path) ?? "";
  const type = opt.type || "text";
  const list = opt.list ? ` list="${opt.list}"` : "";
  const ph = opt.ph ? ` placeholder="${esc(opt.ph)}"` : "";
  const ctl = opt.area
    ? `<textarea data-p="${path}" class="${bad(path)}"${ph}>${esc(v)}</textarea>`
    : `<input type="${type}" data-p="${path}" value="${esc(v)}" class="${bad(path)}"${list}${ph} autocomplete="off">`;
  return `<div class="f"><label>${esc(label)}${opt.req?' <span class="req">*</span>':""}</label>${ctl}${opt.hint?`<span class="hint">${esc(opt.hint)}</span>`:""}${errHtml(path)}</div>`;
}
function sel(path, label, options, opt={}){
  const v = get(path) ?? "";
  const o = [`<option value="">— Seleccione —</option>`].concat(options.map(x => `<option${x===v?" selected":""}>${esc(x)}</option>`)).join("");
  return `<div class="f"><label>${esc(label)}${opt.req?' <span class="req">*</span>':""}</label><select data-p="${path}" class="${bad(path)}">${o}</select>${opt.hint?`<span class="hint">${esc(opt.hint)}</span>`:""}${errHtml(path)}</div>`;
}
function radios(path, label, options, opt={}){

/* ====== EVENTOS ====== */
function bind(){
  document.querySelectorAll("[data-p]").forEach(el => {
    const ev = (el.tagName === "SELECT" || el.type === "radio" || el.type === "checkbox") ? "change" : "input";
    el.addEventListener(ev, () => {
      const path = el.dataset.p;
      const val = el.type === "checkbox" ? el.checked : el.value;
      set(path, val);
      if(path.startsWith("equipos.")){
        const [, i, k] = path.split("."); const q = S.equipos[+i];
        if(k === "magnitud"){ delete q.magnitud_original; q._tocado = false; applyDefaults(q); parsePuntos(q, q.praw ?? (PUNTOS_FIJOS[val] ? "" : q.puntos)); }
        else if(k === "equipo") applyDefaults(q);
        else if(["conformidad","emp","origen_emp","incertidumbre"].includes(k)) q._tocado = true;
        else if(k === "puntos") q.praw = val;
      }
      save();
      // re-render solo cuando cambia la estructura (selects/radios) para no perder el foco al escribir
      if(ev === "change") render();
      else if(showErr) softValidate(el, path);
    });
  });
  document.querySelectorAll("[data-epp]").forEach(el => el.addEventListener("change", () => {
    const x = el.dataset.epp; const a = S.sitio.epp;
    if(el.checked){ if(!a.includes(x)) a.push(x); } else S.sitio.epp = a.filter(y=>y!==x);
    save(); render();
  }));
  document.querySelectorAll("[data-pt]").forEach(el => el.addEventListener("change", () => {
    const [i, v] = el.dataset.pt.split("|"); const q = S.equipos[+i];
    const a = new Set(q.psel || []); el.checked ? a.add(v) : a.delete(v);
    q.psel = [...a]; q.pinv = []; q.puntos = puntosFijosTexto(q); q.praw = q.puntos;
    save(); render();
  }));
  document.querySelectorAll("[data-a]").forEach(el => el.addEventListener("click", () => act(el.dataset.a, el)));
  const drop = $("#drop");
  if(drop){
    $("#file").addEventListener("change", e => { if(e.target.files[0]) readFile(e.target.files[0]); });
    ["dragenter","dragover"].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.add("over"); }));
    ["dragleave","drop"].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.remove("over"); }));
    drop.addEventListener("drop", e => { const f = e.dataTransfer.files[0]; if(f) readFile(f); });
  }
}
// Al escribir: actualiza el marcado de error del campo sin redibujar toda la vista
function softValidate(el, path){
  errs = VALID[step]();
  const key = path.startsWith("equipos.") ? "eq."+path.split(".").slice(1).join(".") : path;
  const m = errs[key];
  el.classList.toggle("bad", !!m);
  let span = el.parentElement.querySelector(".msg");
  if(m && m.trim()){ if(!span){ span = document.createElement("span"); span.className = "msg"; el.parentElement.appendChild(span); } span.textContent = m; }
  else if(span) span.remove();
}
function vidrioExcepcion(equipo){
  const e = norm(equipo); if(!e) return false;
  return VIDRIO_SIN_CONF.some(x => norm(x).split(" ").filter(w => w.length > 3 && w !== "vidrio").every(w => e.includes(w)));
}
function defaultsFor(mag, equipo){
  const si = {conformidad:"SI", emp:EMP_PTC, origen_emp:ORIG_DN, incertidumbre:"Si"};
  const no = {conformidad:"NO", emp:"", origen_emp:"", incertidumbre:""};
  if(mag === M_PISTON || mag === M_PESA_N) return si;
  if(mag === M_VOL_V) return vidrioExcepcion(equipo) ? no : si;
  return no;
}
// Aplica los valores por defecto mientras el cliente no los haya cambiado a mano
function applyDefaults(q){ if(q._tocado || !q.magnitud) return; Object.assign(q, defaultsFor(q.magnitud, q.equipo)); }
// Puntos: en magnitudes fijas se arma "(4\7\10) Unidades de pH"; en las demás, texto separado con "\"
function puntosFijosTexto(q){
  const f = PUNTOS_FIJOS[q.magnitud]; if(!f) return q.puntos;
  const sel = f.v.filter(v => (q.psel||[]).includes(v));
  return sel.length ? "(" + sel.join("\\") + ") " + f.u : "";
}
function parsePuntos(q, raw){
  raw = String(raw ?? "").trim();
  const f = PUNTOS_FIJOS[q.magnitud];
  if(!f){ q.psel = []; q.pinv = []; q.puntos = raw.replace(/\s*[;|]\s*/g, "\\"); return; }
  const toks = raw.replace(/[A-Za-zµμ°()%]/g, " ").split(/[\\\/;|\s]+/).map(t => t.replace(".", ",").replace(/^0+(?=\d)/, "")).filter(Boolean);
  q.psel = f.v.filter(v => toks.includes(v));
  q.pinv = [...new Set(toks.filter(t => !f.v.includes(t)))];
  q.puntos = puntosFijosTexto(q);
}
function act(a, el){
  if(a === "next"){
    errs = VALID[step]();
    if(Object.keys(errs).length){ showErr = true; render(); const f = document.querySelector(".bad"); if(f){ f.scrollIntoView({behavior:"smooth",block:"center"}); } else window.scrollTo({top:0,behavior:"smooth"}); return; }
    showErr = false; step++; save(); render(); window.scrollTo(0,0); return;
  }
  if(a === "prev"){ showErr = false; step--; save(); render(); window.scrollTo(0,0); return; }
  if(a === "reset"){ if(confirm("¿Borrar todo lo diligenciado y empezar de nuevo?")){ clearDraft(); S = blank(); step = 0; showErr = false; render(); } return; }
  if(a === "pick"){ $("#file").click(); return; }
  if(a === "tpl"){ downloadTemplate(); return; }
  if(a === "addrow"){ S.equipos.push(newItem({})); save(); render(); return; }
  if(a === "delrow"){ S.equipos.splice(+el.dataset.i,1); save(); render(); return; }
  if(a === "bulk"){ const v = $("#bulk").value; if(v){ S.equipos.forEach(q=>q.tipo_servicio=v); save(); render(); } return; }
  if(a === "copyprev"){
    const i = +el.dataset.i, p = S.equipos[i-1], q = S.equipos[i];
    for(const k of ["tipo_servicio","conformidad","emp","origen_emp","incertidumbre"]) q[k] = p[k];
    q._tocado = true;
    if(!PUNTOS_FIJOS[q.magnitud] || p.magnitud === q.magnitud){ q.puntos = p.puntos; q.psel = [...(p.psel||[])]; q.pinv = []; q.praw = p.puntos; }
    save(); render(); return;
  }
  if(a === "samedir"){ Object.assign(S.sitio,{direccion:S.cliente.direccion,ciudad:S.cliente.ciudad,contacto:S.cliente.contacto}); save(); render(); return; }
  if(a === "gen"){
    errs = VALID.reduce((o,f)=>Object.assign(o,f()),{});
    if(Object.keys(errs).length){ showErr = true; render(); if(!S.acepta) return; alert("Hay datos pendientes en pasos anteriores. Revíselos antes de enviar."); return; }
    generate(); return;
  }
  if(a === "upload"){ if(/^https:\/\//.test(FILE_REQUEST_URL)) window.open(FILE_REQUEST_URL,"_blank","noopener"); else alert("El enlace de carga no está configurado. Comuníquese con su ejecutiva comercial."); return; }
  if(a === "print"){ window.print(); return; }
}
function newItem(o){
  const it = {magnitud:"",equipo:"",marca:"",modelo:"",serie:"",id:"",resolucion:"",ubicacion:"",tipo_servicio:"",puntos:"",conformidad:"",emp:"",origen_emp:"",incertidumbre:""};
  for(const c of COLS) it[c.k] = String(o[c.k] ?? "").trim();
  const m = matchMag(it.magnitud);
  if(m) it.magnitud = m; else if(it.magnitud){ it.magnitud_original = it.magnitud; it.magnitud = ""; }
  applyDefaults(it);
  it.praw = String(o.puntos ?? "").trim();
  parsePuntos(it, it.praw);
  return it;
}
function matchMag(v){
  const n = norm(v); if(!n) return "";
  if(MAG_BY_NORM.has(n)) return MAG_BY_NORM.get(n);
  const hits = CAT.mag.filter(m => { const mn = norm(m.n); return mn.startsWith(n) || (n.length >= 6 && mn.includes(n)); });
  return hits.length === 1 ? hits[0].n : "";
}

/* ====== ARCHIVOS ====== */
function decodeText(buf){
  try{ return new TextDecoder("utf-8",{fatal:true}).decode(buf); }catch(e){ return new TextDecoder("windows-1252").decode(buf); }
}
function readFile(f){
  const msg = $("#loadmsg");
  if(typeof XLSX === "undefined"){ msg.innerHTML = `<div class="note err">No se pudo cargar el lector de archivos. Revise su conexión a internet y recargue la página.</div>`; return; }
  const rd = new FileReader();
  rd.onload = () => {
    try{
      let wb;
      if(/\.(csv|txt)$/i.test(f.name)){
        const txt = decodeText(new Uint8Array(rd.result)).replace(/^﻿/,"");
        const first = txt.split(/\r?\n/)[0] || "";
        const fs = (first.split(";").length > first.split(",").length) ? ";" : (first.includes("\t") ? "\t" : ",");
        wb = XLSX.read(txt, {type:"string", FS:fs, raw:true});
      } else {
        wb = XLSX.read(rd.result, {type:"array"});
      }
      const ws = wb.Sheets["Equipos"] || wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:"", raw:false, blankrows:false});
      importRows(rows, f.name);
    }catch(e){ msg.innerHTML = `<div class="note err">No se pudo leer el archivo: ${esc(e.message)}</div>`; }
  };
  rd.readAsArrayBuffer(f);
}
function importRows(rows, name){
  const msg = $("#loadmsg");
  // busca la fila de encabezados entre las primeras 10
  let hi = -1, map = null;
  for(let r=0; r<Math.min(10, rows.length); r++){
    const m = {}; rows[r].forEach((h,ci) => { const n = norm(h); const c = COLS_IMPORT.find(c => c.al.includes(n)); if(c && m[c.k] === undefined) m[c.k] = ci; });
    if(m.marca !== undefined && m.modelo !== undefined){ hi = r; map = m; break; }
  }
  if(hi < 0){ msg.innerHTML = `<div class="note err">No se encontraron los encabezados. El archivo debe tener las columnas: ${COLS.map(c=>c.t).join(", ")}. Use «Descargar plantilla».</div>`; return; }
  const missing = COLS.filter(c => map[c.k] === undefined && c.k !== "ubicacion" && c.k !== "id");
  const data = rows.slice(hi+1)
    .map(r => { const o = {}; COLS_IMPORT.forEach(c => { o[c.k] = map[c.k] !== undefined ? r[map[c.k]] : ""; }); return o; })
    .filter(o => COLS.some(c => String(o[c.k]).trim()));
  if(!data.length){ msg.innerHTML = `<div class="note err">El archivo no tiene filas con datos debajo de los encabezados.</div>`; return; }
  if(data.length > MAX_ITEMS){ msg.innerHTML = `<div class="note err">El archivo tiene ${data.length} equipos; el máximo por solicitud es ${MAX_ITEMS}. Divídalo en varias solicitudes.</div>`; return; }
  if(S.equipos.length && !confirm(`Ya hay ${S.equipos.length} equipo(s) en la tabla. ¿Reemplazarlos por los ${data.length} del archivo?`)) return;
  S.equipos = data.map(newItem); S.archivo = name; showErr = true; save(); render();
  if(missing.length) $("#loadmsg").innerHTML = `<div class="note warn">Columnas no encontradas en el archivo: ${missing.map(c=>c.t).join(", ")}. Complételas en la tabla.</div>`;
}
function downloadTemplate(){
  // Plantilla Excel generada con lista desplegable de magnitudes en la columna A
  const bin = atob(PLANTILLA_B64), buf = new Uint8Array(bin.length);
  for(let k=0; k<bin.length; k++) buf[k] = bin.charCodeAt(k);
  const blob = new Blob([buf], {type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "Plantilla_equipos_PCO-FO-04.xlsx";
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 5000);
}

  const pad = n => String(n).padStart(2,"0");
  const stamp = `${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}-${pad(now.getHours())}${pad(now.getMinutes())}`;
  const nit = S.cliente.nit.replace(/[^\d-]/g,"");
  const fname = `SOL_${EJ}_${nit}_${stamp}.json`;
  const out = {
    formato:"PCO-FO-04", origen:"solicitud-web", version_app:APP_VERSION,
    fecha_diligenciamiento: now.toISOString(),
    fecha_local: `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}`,
    ejecutiva:{iniciales:EJ, nombre:EJ_OBJ.n},
    cliente:Object.assign({}, S.cliente, {orden:nd(S.cliente.orden)}), resultados:S.resultados, lugar:S.lugar,
    equipos:S.equipos.map((q,i)=>({item:i+1, magnitud:q.magnitud, equipo:q.equipo, marca:q.marca, modelo:q.modelo, serie:nd(q.serie), id:nd(q.id),
      resolucion:nd(q.resolucion), ubicacion:nd(q.ubicacion), requisitos:reqOf(q.magnitud), tipo_servicio:q.tipo_servicio, puntos:(PUNTOS_FIJOS[q.magnitud] ? puntosFijosTexto(q) : String(q.puntos||"").replace(/\s*[;|]\s*/g,"\\")),
      declaracion_conformidad: q.conformidad==="SI" ? CAT.decl.si : CAT.decl.no,
      emp: q.conformidad==="SI" ? q.emp : "", origen_emp: q.conformidad==="SI" ? q.origen_emp : "N/A",
      incertidumbre: q.conformidad==="SI" ? q.incertidumbre : ""})),
    sitio: enSitio() ? Object.assign({}, S.sitio, {otras:nd(S.sitio.otras)}) : null,
    notas:nd(S.notas), acepta_condiciones:S.acepta
  };
  const blob = new Blob([JSON.stringify(out,null,2)], {type:"application/json"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = fname;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 5000);
  S._generado = fname; save(); render();
  document.getElementById("envio")?.scrollIntoView({behavior:"smooth"});
}

/* ====== INICIO ====== */
(function init(){
  const dl = document.createElement("datalist"); dl.id = "mun";
  dl.innerHTML = CAT.mun.map(m=>`<option value="${esc(m)}">`).join("");
  document.body.appendChild(dl);
  if(EJ_OBJ) load();
  render();
})();
</script>
